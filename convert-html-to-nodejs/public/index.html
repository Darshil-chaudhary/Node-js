<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML with Node.js</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #f5f3ff);
            color: #172554;
        }
        .card {
            width: min(90%, 560px);
            padding: 36px;
            text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
        }
        h1 { margin-top: 0; color: #2563eb; }
        p { line-height: 1.6; color: #475569; }
        button {
            border: 0;
            border-radius: 9px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        #message { margin-top: 18px; font-weight: bold; color: #15803d; }
    </style>
</head>
<body>
    <main class="card">
        <h1>HTML + Node.js</h1>
        <p>This HTML page is being served by a Node.js server using Express.</p>
        <button id="helloBtn">Click Me</button>
        <p id="message" aria-live="polite"></p>
    </main>

    <script>
        document.getElementById("helloBtn").addEventListener("click", function () {
            document.getElementById("message").textContent =
                "Great! Your HTML page is working through the Node.js server.";
        });
    </script>
</body>
</html>
